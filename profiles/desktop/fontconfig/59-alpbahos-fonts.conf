<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  alpbahOS yazı tipi tercihleri. Kurulum hedefi: /etc/fonts/conf.d/59-alpbahos-fonts.conf
  Aileler profiles/desktop/tokens.json typography ile aynı (Inter, JetBrains Mono).

  Neden: KDE platform teması olmadan Qt varsayılan fontu fontconfig'in boş desen için
  ürettiği listenin İLK ailesidir (QFontconfigDatabase::defaultFont). Gen2 imajında bu
  "Noto Sans" (60-latin.conf) ama kurulu değil; Kirigami küçük yazıları tırnaklı fonta
  düştü (29 Eylül). 49-sansserif.conf'tan sonra, 60-latin.conf'tan önce okunur; tercih
  edilen aile sans-serif'in hemen önüne girer ve 60-latin listesinin önünde kalır.
  Font kurulu değilse fontconfig listedeki sonraki aileye geçer (zararsız).
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
</fontconfig>
