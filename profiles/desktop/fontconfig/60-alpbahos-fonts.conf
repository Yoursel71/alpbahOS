<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- alpbahOS (master task E1): Inter for sans-serif, JetBrains Mono for monospace; installed as
     /etc/fonts/conf.d/60-alpbahos-fonts.conf. Fonts: packages font-inter 4.1 and font-jetbrains-mono 2.304 (OFL 1.1). -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Inter Variable</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
</fontconfig>
