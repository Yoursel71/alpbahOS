<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ART-HEAD-START-->
<title>ULTRAKILL 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Chakra+Petch:wght@400;600;700&amp;family=VT323&amp;display=swap">
<style>/* ULTRAKILL 3D — tek karanlık görünüm: boşluk siyahı, kan kırmızısı, kemik beyazı */
:root {
  color-scheme: dark;
  --bg: #07040a;
  --ink: #f2ece4;
  --muted: #9a8e88;
  --red: #d8121b;
  --red-hot: #ff3a24;
  --blue: #3aa0ff;
  --gold: #ffd24a;
  --green: #3ee06a;
  --panel: rgba(10, 5, 8, 0.8);
  --panel-solid: #120a0e;
  --line: rgba(242, 236, 228, 0.16);
  --f-display: 'Anton', Impact, 'Arial Narrow Bold', 'Arial Narrow', sans-serif;
  --f-ui: 'Chakra Petch', system-ui, 'Segoe UI', sans-serif;
  --f-mono: 'VT323', ui-monospace, 'Cascadia Mono', 'Courier New', monospace;
}

html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
#app { position: fixed; inset: 0; background: var(--bg); }
canvas#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
#ui { position: absolute; inset: 0; pointer-events: none; font-family: var(--f-ui); user-select: none; -webkit-user-select: none; }
.hidden { display: none !important; }
#screens { position: absolute; inset: 0; pointer-events: none; }
.screen { position: absolute; inset: 0; pointer-events: auto; overflow: hidden; }
.fatal { position: fixed; inset: auto 16px 16px 16px; padding: 16px; background: var(--red); color: #fff; font: 600 16px var(--f-ui); z-index: 99; }

/* ---------------------------------------------------------------- ortak */
.btn {
  pointer-events: auto;
  display: block;
  background: transparent;
  color: var(--ink);
  border: 2px solid var(--ink);
  font-family: var(--f-display);
  font-size: 24px;
  letter-spacing: 0.06em;
  padding: 8px 18px 6px;
  text-align: left;
  cursor: pointer;
  transition: background 0.08s, color 0.08s, border-color 0.08s, transform 0.08s;
}
.btn:hover, .btn:focus-visible { background: var(--red); border-color: var(--red); color: #fff; outline: none; transform: translateX(4px); }
.btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.big { font-size: 34px; padding: 12px 26px 10px; text-align: center; }
.blink { animation: blink 1.1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }

.logo { display: flex; align-items: flex-start; gap: 0.12em; line-height: 0.9; }
.logo .l1 {
  font-family: var(--f-display);
  font-size: clamp(56px, 11vw, 150px);
  color: var(--red);
  letter-spacing: 0.01em;
  text-shadow: 3px 0 0 rgba(58, 160, 255, 0.55), -3px 0 0 rgba(255, 210, 74, 0.35), 0 0 30px rgba(216, 18, 27, 0.45);
  animation: glitch 3.2s infinite;
  transform: skewX(-6deg);
}
.logo .l2 { font-family: var(--f-display); font-size: clamp(22px, 3.4vw, 44px); color: var(--ink); margin-top: 0.3em; }
.logo.small .l1 { font-size: clamp(44px, 5.6vw, 84px); }
.logo.small .l2 { font-size: clamp(18px, 2vw, 28px); }
@keyframes glitch {
  0%, 88%, 100% { transform: skewX(-6deg) translate(0, 0); }
  89% { transform: skewX(-6deg) translate(-4px, 1px); text-shadow: 6px 0 0 rgba(58, 160, 255, 0.8), -6px 0 0 rgba(255, 210, 74, 0.6); }
  91% { transform: skewX(-10deg) translate(3px, -1px); }
  93% { transform: skewX(-6deg) translate(-1px, 0); }
}
.sub { font-family: var(--f-mono); font-size: 22px; letter-spacing: 0.42em; color: var(--muted); }

/* ---------------------------------------------------------------- açılış */
#scr-splash {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  padding-inline: 16px;
  background: radial-gradient(ellipse at 50% 60%, rgba(120, 10, 10, 0.35), rgba(7, 4, 10, 0.95) 70%), var(--bg);
  cursor: pointer; text-align: center;
}
#scr-splash::after, #scr-menu::after, #scr-intro::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.18) 0 1px, transparent 1px 3px);
}
.press { font-family: var(--f-mono); font-size: 30px; letter-spacing: 0.2em; margin-top: 24px; }
.disclaimer { position: absolute; bottom: 18px; inset-inline: 16px; font-size: 13px; line-height: 1.5; color: var(--muted); max-width: 70ch; margin: 0 auto; }

/* ---------------------------------------------------------------- ana menü */
#scr-menu {
  display: grid; grid-template-columns: minmax(280px, 400px) 1fr; gap: 24px;
  padding: 40px 32px; box-sizing: border-box;
  background: linear-gradient(90deg, rgba(7, 4, 10, 0.94) 0%, rgba(7, 4, 10, 0.75) 32%, rgba(7, 4, 10, 0.15) 60%, rgba(7, 4, 10, 0.55) 100%);
}
.menu-left { display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }
.menu-left nav { display: flex; flex-direction: column; gap: 10px; margin-top: 28px; max-width: 280px; }
.menu-left .ver { margin-top: auto; font-family: var(--f-mono); font-size: 18px; color: var(--muted); }
.menu-right { display: flex; justify-content: flex-end; align-items: flex-start; min-width: 0; position: relative; z-index: 1; }
.panel-box {
  pointer-events: auto;
  width: min(560px, 100%); max-height: calc(100vh - 80px); overflow-y: auto; box-sizing: border-box;
  background: var(--panel); border: 1px solid var(--line); padding: 22px 26px 26px;
  backdrop-filter: blur(3px);
}
.panel-box h2 { font-family: var(--f-display); font-weight: 400; font-size: 34px; letter-spacing: 0.05em; margin: 0 0 14px; text-wrap: balance; }
.panel-box h3 { font-family: var(--f-mono); font-weight: 400; font-size: 20px; letter-spacing: 0.3em; color: var(--muted); margin: 20px 0 8px; }
.panel-box p { font-size: 15px; line-height: 1.55; color: #d8d0c6; max-width: 62ch; }
.panel-box .note { font-size: 13px; color: var(--muted); }

.level-card { display: flex; gap: 16px; border: 2px solid var(--ink); padding: 10px; background: rgba(0, 0, 0, 0.35); }
.lc-thumb {
  flex: 0 0 110px; height: 110px; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 70%, #ff6a1a 0%, #8a0a0a 45%, #1a0406 80%);
  font-family: var(--f-display); font-size: 42px; color: #fff; text-shadow: 0 2px 0 #000;
}
.lc-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.lc-layer { font-family: var(--f-mono); font-size: 18px; letter-spacing: 0.2em; color: var(--red-hot); }
.lc-name { font-family: var(--f-display); font-size: 30px; letter-spacing: 0.03em; }
.lc-best { font-family: var(--f-mono); font-size: 20px; color: var(--muted); }
.lc-best b { font-family: var(--f-display); font-weight: 400; font-size: 24px; }
.lc-desc { font-size: 13px; color: var(--muted); }
.diffs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.diffs .btn { font-size: 17px; text-align: center; padding: 8px 4px 6px; }
.diffs .btn:hover { transform: none; }
.diff-desc { margin-top: 8px; font-size: 14px; color: #d8d0c6; min-height: 1.4em; }
.chk { pointer-events: auto; display: flex; align-items: center; gap: 8px; margin: 16px 0; font-size: 15px; cursor: pointer; }
.chk input { accent-color: var(--red); width: 18px; height: 18px; }
.btn.start { width: 100%; }
/* bölüm seçimi */
.lv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.lv-card {
  pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 6px;
  background: rgba(0, 0, 0, 0.4); border: 2px solid var(--line); color: var(--ink); cursor: pointer; min-width: 0;
}
.lv-card .lv-id { font-family: var(--f-display); font-size: 30px; line-height: 1; }
.lv-card .lv-name { font-family: var(--f-mono); font-size: 14px; line-height: 1; color: var(--muted); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.lv-card .lv-rank { font-family: var(--f-display); font-size: 22px; line-height: 1; }
.lv-card.sel { border-color: var(--red-hot); background: rgba(120, 10, 10, 0.55); }
.lv-card.sel .lv-name { color: var(--ink); }
.lv-card.locked { opacity: 0.4; cursor: default; }
.lv-layer { margin: 10px 0 5px; font-family: var(--f-mono); font-size: 15px; letter-spacing: 0.14em; color: var(--muted); }
.lv-layer:first-of-type { margin-top: 2px; }
.lv-card.endless .lv-id { color: #40f0ff; }
.char-row { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; flex-wrap: wrap; }
.char-lbl { font-family: var(--f-mono); font-size: 15px; letter-spacing: 0.12em; color: var(--muted); }
.btn.char { font-size: 20px; padding: 4px 16px 2px; min-width: 64px; text-align: center; }
.btn.char.on { background: var(--red-hot); border-color: var(--red-hot); color: #fff; }
.btn.char.locked { opacity: 0.4; }
.char-desc { font-family: var(--f-mono); font-size: 14px; color: #d8d0c6; }
.lv-info { margin: 10px 0 12px; font-size: 14px; line-height: 1.45; color: #d8d0c6; }
.lv-info b { color: var(--ink); font-family: var(--f-display); font-weight: 400; letter-spacing: 0.03em; font-size: 17px; }
.lv-info .muted { color: var(--muted); }
.h2-pts { float: right; font-family: var(--f-mono); color: #39ff6a; font-size: 22px; letter-spacing: 0.04em; margin-top: 6px; }
.start-bar { position: sticky; bottom: -26px; margin: 12px -26px -26px; padding: 10px 26px 14px; background: linear-gradient(transparent, rgba(7, 4, 10, 0.96) 30%); }
/* dükkân */
#scr-shop { background: rgba(2, 10, 4, 0.9); display: grid; place-items: center; padding: 12px 16px; box-sizing: border-box; overflow-y: auto; touch-action: pan-y; }
.shop-box { width: min(1100px, 100%); pointer-events: auto; font-family: var(--f-mono); color: #b8ffc8; }
.sh-head { display: flex; align-items: center; gap: 16px; margin-bottom: 6px; }
.sh-title { font-family: var(--f-display); font-size: 42px; color: #39ff6a; letter-spacing: 0.05em; text-shadow: 0 0 18px rgba(57, 255, 106, 0.5); }
.sh-pts { font-size: 26px; color: #39ff6a; }
.sh-pts b { font-weight: 400; color: #fff; }
.sh-close { margin-left: auto; border-color: #39ff6a; color: #b8ffc8; text-align: center; min-width: 140px; }
.sh-close:hover { background: #39ff6a; border-color: #39ff6a; color: #021a08; transform: none; }
.sh-note { font-size: 15px; color: #6fbf82; margin-bottom: 10px; }
.sh-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.sh-group { border: 1px solid rgba(57, 255, 106, 0.4); background: rgba(2, 26, 8, 0.7); padding: 8px 10px; }
.sh-gname { font-size: 18px; letter-spacing: 0.15em; color: #39ff6a; margin-bottom: 4px; }
.sh-item { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 8px; padding: 4px 0; border-top: 1px solid rgba(57, 255, 106, 0.15); }
.sh-item i { width: 12px; height: 12px; display: block; }
.sh-name { font-size: 18px; color: #e8ffe8; line-height: 1.05; }
.sh-name small { display: block; font-size: 13px; color: #6fbf82; }
.sh-item.locked .sh-name { opacity: 0.55; }
.sh-tag { font-weight: 400; font-size: 15px; color: #39ff6a; }
.sh-tag.lock { color: #6f8f76; font-size: 13px; }
.sh-buy { pointer-events: auto; min-width: 104px; min-height: 40px; font-family: var(--f-mono); font-size: 19px; color: #021a08; background: #39ff6a; border: 0; cursor: pointer; padding: 4px 10px; }
.sh-buy.cant { background: #24402a; color: #6f8f76; }
.sh-buy.shake { animation: shk 0.3s; }
@keyframes shk { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.res-p { color: #39ff6a; }
.res-btns .btn.next { font-size: 30px; }

.set-row { display: grid; grid-template-columns: 1fr minmax(120px, 190px) 56px; align-items: center; gap: 12px; padding: 5px 0; font-size: 15px; }
.set-row input[type=range] { pointer-events: auto; width: 100%; accent-color: var(--red); }
.set-row .val { font-family: var(--f-mono); font-size: 20px; text-align: right; font-variant-numeric: tabular-nums; }
.set-row .tog { grid-column: 2 / 4; font-size: 16px; padding: 5px 12px 3px; text-align: center; }
.set-row .tog:hover { transform: none; }

table.keys { border-collapse: collapse; width: 100%; font-size: 14px; }
table.keys td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.keys td:first-child { white-space: nowrap; width: 1%; }
kbd { font-family: var(--f-mono); font-size: 19px; padding: 1px 7px; border: 1px solid var(--ink); background: rgba(255, 255, 255, 0.06); }
.about-list { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.7; color: #d8d0c6; }

/* ---------------------------------------------------------------- intro */
#scr-intro .noise { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; opacity: 0.07; pointer-events: none; }
#scr-intro .crt { position: absolute; inset: 0; background: #fff; pointer-events: none; opacity: 0; }
#scr-intro.crt-on .crt { animation: crt 0.7s ease-out forwards; }
@keyframes crt { 0% { opacity: 1; transform: scale(1, 0.004); } 40% { opacity: 1; transform: scale(1, 0.004); } 70% { opacity: 0.8; transform: scale(1, 1); } 100% { opacity: 0; transform: scale(1, 1); } }
#scr-intro.jolt { animation: jolt 0.35s; }
@keyframes jolt { 0% { transform: translate(0, 0); } 20% { transform: translate(-8px, 5px); } 40% { transform: translate(7px, -4px); } 60% { transform: translate(-4px, 3px); } 80% { transform: translate(2px, -1px); } 100% { transform: none; } }
.term .cur { animation: blink 0.6s steps(2, start) infinite; color: var(--ink); }
.term .bar { color: var(--red-hot); }
.term.gone { opacity: 0; transition: opacity 0.6s; }
.intro-big { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.1em; pointer-events: none; }
.big-line { position: relative; font-family: var(--f-display); font-size: clamp(48px, 10vw, 128px); line-height: 1; color: var(--red); letter-spacing: 0.03em; text-shadow: 0 0 30px rgba(216, 18, 27, 0.6), 0 5px 0 #000; animation: slam 0.45s cubic-bezier(0.2, 1.5, 0.4, 1); }
#scr-intro { background: #000; padding: 40px clamp(16px, 6vw, 80px); box-sizing: border-box; cursor: pointer; overflow: hidden; }
.term { position: relative; max-height: calc(100% - 80px); overflow: hidden; font-family: var(--f-mono); font-size: clamp(18px, 2.2vw, 28px); line-height: 1.25; color: #cfc8bc; margin: 0; white-space: pre-wrap; }
.term .tl { min-height: 1.25em; }
.term .st { color: var(--green); }
.term .bad .st { color: var(--red-hot); }
.term .red .st { color: var(--red-hot); text-shadow: 0 0 10px rgba(255, 58, 36, 0.7); }
.term .big { font-family: var(--f-display); font-size: clamp(38px, 6vw, 76px); color: var(--red); line-height: 1.05; margin-top: 6px; letter-spacing: 0.02em; }
.term-cont { position: absolute; bottom: 60px; left: 0; right: 0; text-align: center; font-family: var(--f-mono); font-size: 28px; letter-spacing: 0.2em; }
.term-skip { position: absolute; bottom: 18px; right: 24px; font-family: var(--f-mono); font-size: 18px; color: #555; }

/* ---------------------------------------------------------------- duraklatma */
#scr-pause { background: rgba(7, 4, 10, 0.72); display: grid; place-items: center; padding-inline: 16px; }
.pause-box { display: flex; flex-direction: column; gap: 10px; width: min(380px, 100%); }
.pause-box h1 { font-family: var(--f-display); font-weight: 400; font-size: 54px; margin: 0 0 12px; letter-spacing: 0.04em; }
.pause-box .panel-box { width: min(560px, 92vw); max-height: 60vh; margin-top: 12px; }

/* ---------------------------------------------------------------- sonuçlar */
#scr-results { background: rgba(7, 4, 10, 0.86); display: grid; place-items: center; padding-inline: 16px; overflow-y: auto; }
.res-box { width: min(680px, 100%); pointer-events: auto; padding-block: 24px; }
.res-title { font-family: var(--f-display); font-size: clamp(30px, 4.4vw, 48px); letter-spacing: 0.03em; margin-bottom: 18px; }
.res-title span { color: var(--red-hot); font-size: 0.6em; letter-spacing: 0.2em; margin-left: 10px; }
.res-rows { display: flex; flex-direction: column; gap: 6px; }
.res-row {
  display: grid; grid-template-columns: 170px 1fr 64px; align-items: center; gap: 12px;
  background: var(--panel); border: 1px solid var(--line); padding: 8px 14px;
  transition: opacity 0.2s, transform 0.2s;
}
.res-row.pending { opacity: 0.12; transform: translateX(-10px); }
.res-row span { font-family: var(--f-mono); font-size: 22px; letter-spacing: 0.18em; color: var(--muted); }
.res-row b { font-family: var(--f-mono); font-weight: 400; font-size: 30px; font-variant-numeric: tabular-nums; }
.res-row.challenge b { font-size: 20px; }
.res-row .rk { font-family: var(--f-display); font-style: normal; font-size: 44px; text-align: center; line-height: 1; }
.res-row .rk.wait { visibility: hidden; }
.res-row .rk.ok { color: var(--green); font-size: 34px; }
.res-row .rk.no { color: var(--muted); font-size: 34px; }
.secs { display: flex; gap: 10px; }
.sec { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--blue); transform: rotate(45deg); }
.sec.on { background: var(--blue); box-shadow: 0 0 12px var(--blue); }
.res-final { display: flex; align-items: center; justify-content: center; gap: 24px; margin: 18px 0 6px; }
.res-final span { font-family: var(--f-mono); font-size: 26px; letter-spacing: 0.25em; color: var(--muted); }
.rank-big { font-family: var(--f-display); font-size: clamp(110px, 16vw, 170px); line-height: 0.9; animation: stamp 0.35s cubic-bezier(0.2, 1.6, 0.4, 1); text-shadow: 0 0 30px currentColor; }
.prank { font-family: var(--f-display); font-size: 30px; color: var(--gold); }
@keyframes stamp { from { transform: scale(2.6) rotate(-8deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
.res-extra { text-align: center; font-family: var(--f-mono); font-size: 19px; color: var(--muted); }
.res-extra b { color: var(--gold); font-weight: 400; }
.res-btns { display: flex; gap: 12px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.res-btns .btn { text-align: center; }

/* ---------------------------------------------------------------- HUD */
#hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--f-mono); }
#flash { position: absolute; inset: 0; opacity: 0; }
#dmgvig { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(200, 0, 0, 0.55) 100%); }

#crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
#crosshair .ch { position: absolute; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.7); }
#crosshair .ch.l { width: 7px; height: 2px; left: -12px; top: -1px; }
#crosshair .ch.r { width: 7px; height: 2px; left: 5px; top: -1px; }
#crosshair .ch.t { width: 2px; height: 7px; left: -1px; top: -12px; }
#crosshair .ch.b { width: 2px; height: 7px; left: -1px; top: 5px; }
#crosshair.parry .ch { background: var(--blue); }
#hitmark { position: absolute; left: 0; top: 0; opacity: 0; }
#hitmark i { position: absolute; width: 9px; height: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6); }
#hitmark i:nth-child(1) { transform: translate(-16px, -12px) rotate(45deg); }
#hitmark i:nth-child(2) { transform: translate(7px, -12px) rotate(-45deg); }
#hitmark i:nth-child(3) { transform: translate(-16px, 10px) rotate(-45deg); }
#hitmark i:nth-child(4) { transform: translate(7px, 10px) rotate(45deg); }
#hitmark.kill i { background: var(--red-hot); }
.ch-hp, .ch-st { position: absolute; left: -22px; width: 44px; height: 3px; background: rgba(0, 0, 0, 0.6); }
.ch-hp { top: 22px; }
.ch-st { top: 27px; }
.ch-hp i, .ch-st i { display: block; height: 100%; }
.ch-hp i { background: var(--red-hot); }
.ch-st i { background: var(--blue); }

.panel { background: var(--panel); border: 1px solid var(--line); }
#hud-bl { position: absolute; left: 22px; bottom: 22px; width: 300px; padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 8px; transform: skewX(-4deg); }
.hp-row { display: flex; align-items: center; gap: 10px; }
.hp-bar { position: relative; flex: 1; height: 22px; background: #1a0808; border: 1px solid rgba(255, 255, 255, 0.25); overflow: hidden; }
.hp-bar i { position: absolute; top: 0; bottom: 0; left: 0; }
.hp-hard { background: #5a0a0c; }
.hp-fill { background: linear-gradient(180deg, #ff4a3a, #b80c12); }
.hp-heal { background: rgba(120, 255, 160, 0.6); opacity: 0; }
.hp-num { font-size: 34px; width: 48px; text-align: right; line-height: 0.8; font-variant-numeric: tabular-nums; }
.stam-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }

#deathscreen {

}

#deathscreen .ds-noise { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; opacity: 0; mix-blend-mode: screen; transition: opacity 0.5s; }

.ds-term { font-family: var(--f-mono); font-size: clamp(18px, 2.4vw, 28px); line-height: 1.2; color: #e8c8c0; min-height: 6em; width: min(640px, 100%); white-space: pre-wrap; }

.ds-title { position: relative; font-family: var(--f-display); font-size: clamp(80px, 15vw, 180px); line-height: 0.95; color: var(--red-hot); text-shadow: 0 6px 0 #000; letter-spacing: 0.05em; animation: slam 0.4s cubic-bezier(0.2, 1.5, 0.4, 1); }
.ds-title::before, .ds-title::after, .big-line::before, .big-line::after { content: attr(data-text); position: absolute; left: 0; top: 0; width: 100%; opacity: 0.5; }
.ds-title::before, .big-line::before { color: #3aa0ff; transform: translate(-4px, 0); clip-path: inset(10% 0 55% 0); animation: glitchA 1.7s steps(2) infinite; }
.ds-title::after, .big-line::after { color: #ffd24a; transform: translate(4px, 0); clip-path: inset(60% 0 8% 0); animation: glitchB 2.3s steps(2) infinite; }
@keyframes glitchA { 0%, 90% { transform: translate(-3px, 0); } 92% { transform: translate(-12px, -2px); } 95% { transform: translate(6px, 1px); } }
@keyframes glitchB { 0%, 85% { transform: translate(3px, 0); } 88% { transform: translate(14px, 2px); } 93% { transform: translate(-8px, 0); } }
@keyframes slam { from { transform: scale(2.4); opacity: 0; filter: blur(4px); } to { transform: none; opacity: 1; filter: none; } }

/* ---------------------------------------------------------------- dokunmatik kontroller */
#touch { --t-alpha: 0.85; position: absolute; inset: 0; pointer-events: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
#touch .t-look { position: absolute; inset: 0; pointer-events: auto; touch-action: none; }
.t-joyzone { position: absolute; left: 0; bottom: 0; width: 42%; height: 64%; pointer-events: auto; touch-action: none; }
.t-joy {
  position: absolute; width: 124px; height: 124px; transform: translate(-50%, -50%); border-radius: 50%;
  border: 2px solid rgba(242, 236, 228, 0.35); background: rgba(7, 4, 10, 0.28); opacity: var(--t-alpha);
  transition: border-color 0.1s, background 0.1s;
}
.t-joy.on { border-color: rgba(242, 236, 228, 0.75); background: rgba(7, 4, 10, 0.45); transition: none; }
.t-knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(242, 236, 228, 0.75); box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.35); }
.t-btn {
  position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; opacity: var(--t-alpha);
  display: grid; place-items: center; padding: 0; cursor: pointer;
  background: rgba(7, 4, 10, 0.45); border: 2px solid rgba(242, 236, 228, 0.6); color: var(--ink);
  font-family: var(--f-mono); letter-spacing: 0.04em; line-height: 1; -webkit-user-select: none; user-select: none;
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.5);
}
.t-btn span { pointer-events: none; }
.t-btn.hide { display: none; }
.t-btn.down { background: rgba(242, 236, 228, 0.9); color: var(--bg); border-color: var(--ink); transform: scale(0.94); }
.t-fire { background: rgba(216, 18, 27, 0.55); border-color: #ff7a6a; }
.t-fire.down { background: rgba(255, 58, 36, 0.95); color: #fff; }
.t-fire.t-left { border-style: dashed; }
.t-parry { background: rgba(30, 90, 200, 0.5); border: 3px solid #8fd0ff; color: #dff2ff; }
.t-parry.ready { box-shadow: 0 0 0 4px rgba(143, 208, 255, 0.55), 0 0 22px #3aa0ff; }
.t-parry.down { background: rgba(143, 208, 255, 0.95); color: #031020; }
.t-blue { border-color: rgba(58, 160, 255, 0.9); }
.t-green { border-color: #9adf5a; color: #d8ffb8; }
.t-red { border-color: #ff6a5a; color: #ffd0c8; background: rgba(120, 10, 10, 0.5); }
.t-shop { border-color: #39ff6a; color: #b8ffc8; background: rgba(2, 40, 12, 0.75); box-shadow: 0 0 18px rgba(57, 255, 106, 0.45); font-weight: 700; }
.t-top { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); display: flex; gap: 5px; pointer-events: none; }
.t-sm {
  pointer-events: auto; touch-action: none; width: 40px; height: 40px; padding: 0; opacity: var(--t-alpha);
  background: rgba(7, 4, 10, 0.6); border: 1px solid rgba(242, 236, 228, 0.45); color: var(--ink);
  font-family: var(--f-mono); font-size: 22px; cursor: pointer;
}
.t-sm.cur { background: var(--ink); color: var(--bg); }
.t-sm.down { background: var(--red); border-color: var(--red); }
.t-sm.none { display: none; }
.t-rotate { position: absolute; left: 16px; right: 16px; top: 42%; text-align: center; padding: 12px; background: var(--panel); border: 1px solid var(--line); font-family: var(--f-mono); font-size: 24px; }
.t-rotate b { color: var(--gold); font-weight: 400; }
#touch.editing { pointer-events: auto; background: rgba(7, 4, 10, 0.55); }
#touch.editing .t-btn { outline: 2px dashed var(--gold); outline-offset: 3px; }
#touch.editing .t-look, #touch.editing .t-joyzone { pointer-events: none; }
#touch.editing .t-joyzone { outline: 2px dashed rgba(242, 236, 228, 0.3); }
.t-edit { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); display: flex; gap: 10px; align-items: center; pointer-events: auto; flex-wrap: wrap; justify-content: center; }
.t-edit-msg { width: 100%; text-align: center; font-family: var(--f-mono); font-size: 22px; color: var(--gold); }

#app.touch #scr-menu { grid-template-columns: minmax(200px, 30%) 1fr; }
#app.touch .panel-box { backdrop-filter: none; background: rgba(12, 8, 14, 0.94); }
#app.touch .logo .l1 { animation: none; text-shadow: 2px 0 0 rgba(58, 160, 255, 0.55), 0 0 18px rgba(216, 18, 27, 0.4); }
#app.touch #scr-splash::after, #app.touch #scr-menu::after, #app.touch #scr-intro::after { display: none; }
#app.touch .menu-left .ver { display: none; }
#app.touch .btn { transition: none; }
#app.touch .btn:hover { transform: none; }
#app.touch .sh-grid { grid-template-columns: repeat(3, 1fr); }
@media (pointer: coarse) {
  html, body { touch-action: none; overscroll-behavior: none; }
  .panel-box { touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  .btn { min-height: 44px; }
  .set-row { padding: 8px 0; }
  .set-row input[type=range] { height: 28px; }
  .chk input { width: 24px; height: 24px; }
  #scr-results { touch-action: pan-y; }
}
.sh-buy.sh-toggle { background: rgba(255, 180, 60, 0.12); border-color: #ffb040; color: #ffd080; }
.sh-buy.sh-toggle.on { background: #ffb040; color: #1a0e02; }

/* Terminal (CLI) teması — yalnız açılış, ana menü ve intro ekranları. Oyun içi arayüz ayrıdır. */
.term-screen {
  --t-bg: #040704;
  --t-fg: #cdf5d2;
  --t-green: #39ff6a;
  --t-dim: #5e8c66;
  --t-line: rgba(57, 255, 106, 0.28);
  --t-red: #ff3b3b;
  --t-amber: #ffb000;
  --t-sel: #39ff6a;
  font-family: var(--f-mono);
  color: var(--t-fg);
}
.term-screen::after { display: none; }
/* pencere başlığı */
.tw-bar {
  position: absolute; left: 0; right: 0; top: 0; height: 26px; z-index: 3;
  display: flex; align-items: center; gap: 7px; padding: 0 12px; box-sizing: border-box;
  background: #0d130d; border-bottom: 1px solid var(--t-line);
  font-family: var(--f-mono); font-size: 17px; color: var(--t-dim); pointer-events: none;
}
.tw-bar i { width: 11px; height: 11px; border-radius: 50%; background: #3a403a; display: block; }
.tw-bar i:nth-child(1) { background: #ff5f56; }
.tw-bar i:nth-child(2) { background: #ffbd2e; }
.tw-bar i:nth-child(3) { background: #27c93f; }
.tw-bar span { margin: 0 auto; transform: translateX(-24px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.term-screen .cur, .term-screen .blink { animation: blink 1s steps(2, start) infinite; }

/* ASCII logo */
.ascii-logo {
  margin: 0; font-family: 'Cascadia Mono', 'DejaVu Sans Mono', ui-monospace, monospace; line-height: 1; letter-spacing: 0;
  font-size: clamp(7px, 1.35vw, 17px); color: var(--t-red); white-space: pre;
  text-shadow: 0.12em 0.12em 0 #4a0608, 0 0 14px rgba(255, 40, 40, 0.45);
}
.ascii-logo.small { font-size: clamp(5px, 0.72vw, 10px); }

/* ---- açılış ---- */
#scr-splash.term-screen {
  display: block; padding: 44px clamp(16px, 5vw, 60px) 16px; box-sizing: border-box; text-align: left;
  background: radial-gradient(ellipse at 30% 30%, rgba(20, 50, 22, 0.35), rgba(4, 7, 4, 0.94) 70%), var(--t-bg);
}
.sp-body { display: flex; flex-direction: column; gap: 14px; max-width: 980px; }
.sp-tag { color: var(--t-dim); font-size: 22px; letter-spacing: 0.08em; }
.boot-log { font-size: clamp(15px, 1.9vw, 22px); line-height: 1.3; }
.boot-log .bl { opacity: 0; animation: blIn 0.01s linear forwards; }
.boot-log .ts { color: var(--t-dim); }
.boot-log b { color: var(--t-green); font-weight: 400; }
@keyframes blIn { to { opacity: 1; } }
#scr-splash .press { font-family: var(--f-mono); font-size: clamp(20px, 2.6vw, 30px); letter-spacing: 0.02em; margin-top: 6px; color: var(--t-fg); }
#scr-splash .ps1 { color: var(--t-green); }
#scr-splash .press-hint { margin-top: 10px; color: var(--t-amber); font-size: 0.8em; animation: blink 1.1s steps(2, start) infinite; }
#scr-splash .disclaimer { color: var(--t-dim); font-family: var(--f-mono); font-size: 15px; text-align: left; max-width: none; }

/* ---- ana menü ---- */
#scr-menu.term-screen {
  padding-top: 42px;
  background: linear-gradient(90deg, rgba(4, 7, 4, 0.95) 0%, rgba(4, 7, 4, 0.8) 30%, rgba(4, 7, 4, 0.2) 60%, rgba(4, 7, 4, 0.6) 100%);
}
#scr-menu.term-screen .sub { font-family: var(--f-mono); color: var(--t-dim); font-size: 18px; letter-spacing: 0.06em; }
#scr-menu.term-screen .ver { color: var(--t-dim); }
#scr-menu.term-screen nav .btn, .term-screen .btn {
  font-family: var(--f-mono); letter-spacing: 0.02em; color: var(--t-fg); border: 1px solid var(--t-line);
  background: rgba(4, 12, 5, 0.6); text-transform: none;
}
#scr-menu.term-screen nav .btn { font-size: 26px; padding: 5px 14px 3px; }
#scr-menu.term-screen nav .btn .cmd::before { content: '$ '; color: var(--t-green); }
#scr-menu.term-screen nav .btn.on { background: var(--t-sel); color: #031005; border-color: var(--t-sel); }
#scr-menu.term-screen nav .btn.on .cmd::before { color: #031005; }
#scr-menu.term-screen nav .btn.on .cmd::after { content: ' ▌'; animation: blink 1s steps(2, start) infinite; }
.term-screen .btn:hover, .term-screen .btn:focus-visible { background: rgba(57, 255, 106, 0.18); border-color: var(--t-green); color: #fff; transform: none; }
.term-screen .btn.on { background: var(--t-sel); color: #031005; border-color: var(--t-sel); }
/* sağ bölme */
#scr-menu.term-screen .panel-box {
  background: rgba(4, 9, 5, 0.93); border: 1px solid var(--t-line); backdrop-filter: none;
  font-family: var(--f-mono); color: var(--t-fg); position: relative; padding-top: 18px;
}
#scr-menu.term-screen .panel-box h2 { font-family: var(--f-mono); font-size: 30px; letter-spacing: 0.03em; color: var(--t-fg); }
#scr-menu.term-screen .panel-box h2::before { content: '$ '; color: var(--t-green); }
#scr-menu.term-screen .panel-box h3 { color: var(--t-amber); letter-spacing: 0.12em; font-size: 20px; }
#scr-menu.term-screen .panel-box h3::before { content: '## '; color: var(--t-dim); }
#scr-menu.term-screen .panel-box p, #scr-menu.term-screen .about-list, #scr-menu.term-screen table.keys { font-family: var(--f-mono); font-size: 18px; color: var(--t-fg); }
#scr-menu.term-screen .panel-box .note { color: var(--t-dim); font-size: 16px; }
#scr-menu.term-screen kbd { border-color: var(--t-line); color: var(--t-green); background: rgba(57, 255, 106, 0.06); }
#scr-menu.term-screen table.keys td { border-bottom: 1px dashed rgba(57, 255, 106, 0.18); }
/* bölüm listesi: terminal kartları */
.term-screen .lv-grid { gap: 5px; }
.term-screen .lv-card { border: 1px solid var(--t-line); background: rgba(4, 14, 6, 0.7); color: var(--t-fg); font-family: var(--f-mono); }
.term-screen .lv-card .lv-id { font-family: var(--f-mono); font-size: 30px; color: var(--t-green); }
.term-screen .lv-card .lv-name { font-size: 15px; color: var(--t-dim); }
.term-screen .lv-card.sel { background: var(--t-sel); border-color: var(--t-sel); }
.term-screen .lv-card.sel .lv-id, .term-screen .lv-card.sel .lv-name { color: #031005; }
.term-screen .lv-card.sel .lv-rank { text-shadow: 0 0 1px #000; }
.term-screen .lv-card .lv-rank { font-family: var(--f-mono); font-size: 24px; }
.term-screen .lv-layer { color: var(--t-amber); font-size: 16px; letter-spacing: 0.1em; }
.term-screen .lv-layer::before { content: '## '; color: var(--t-dim); }
.term-screen .lv-card.endless .lv-id { color: #40f0ff; }
.term-screen .char-lbl { color: var(--t-dim); font-size: 16px; }
.term-screen .char-lbl::before { content: '--'; }
.term-screen .char-lbl::after { content: '='; color: var(--t-dim); }
.term-screen .btn.char.on { background: var(--t-sel); color: #031005; border-color: var(--t-sel); }
.term-screen .char-desc { color: var(--t-dim); font-size: 15px; }
.term-screen .lv-info { font-family: var(--f-mono); font-size: 17px; color: var(--t-fg); }
.term-screen .lv-info b { font-family: var(--f-mono); color: var(--t-green); font-size: 19px; }
.term-screen .lv-info b::before { content: '> '; }
.term-screen .diffs .btn { font-size: 18px; }
.term-screen .diff-desc { font-family: var(--f-mono); color: var(--t-dim); font-size: 16px; }
.term-screen .h2-pts { color: var(--t-amber); }
.term-screen .start-bar { background: linear-gradient(transparent, rgba(4, 9, 5, 0.97) 30%); }
.term-screen .btn.big.start { font-size: 32px; text-align: center; border: 1px solid var(--t-green); color: var(--t-green); background: rgba(57, 255, 106, 0.08); }
.term-screen .btn.big.start::before { content: '$ '; }
.term-screen .btn.big.start::after { content: ' ▌'; animation: blink 1s steps(2, start) infinite; }
.term-screen .btn.big.start:hover { background: var(--t-green); color: #031005; }
.term-screen .set-row { font-family: var(--f-mono); font-size: 18px; }
.term-screen .set-row input[type=range] { accent-color: var(--t-green); }
.term-screen .set-row .val { color: var(--t-green); }
.term-screen .chk input { accent-color: var(--t-green); }

/* ---- intro ---- */
#scr-intro.term-screen { padding-top: 46px; background: #020402; }
#scr-intro.term-screen .term { color: var(--t-fg); }
#scr-intro.term-screen .term-cont { color: var(--t-amber); }

/* dar / alçak / dokunmatik ekranlar */
@media (max-width: 760px) {
  #scr-menu.term-screen { background: rgba(4, 7, 4, 0.9); }
}
@media (max-height: 520px) {
  .tw-bar { height: 22px; font-size: 15px; }
  #scr-menu.term-screen { padding-top: 32px; }
  #scr-splash.term-screen { padding-top: 32px; }
  .sp-body { gap: 8px; }
  .sp-tag { font-size: 17px; }
  .boot-log { font-size: 15px; }
  #scr-splash .press { font-size: 20px; }
  #scr-splash .disclaimer { font-size: 12px; bottom: 8px; }
  #scr-menu.term-screen nav .btn { font-size: 21px; padding: 3px 10px 1px; }
  #scr-menu.term-screen .panel-box h2 { font-size: 22px; }
  #scr-menu.term-screen .panel-box h3 { font-size: 16px; margin: 10px 0 4px; }
  .term-screen .lv-card .lv-id { font-size: 22px; }
  .term-screen .lv-card .lv-name { font-size: 12px; }
  .term-screen .btn.big.start { font-size: 24px; }
  .term-screen .set-row { font-size: 15px; }
  #scr-intro.term-screen { padding-top: 34px; }
  .term-screen .diffs { grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .term-screen .diffs .btn { font-size: 15px; padding: 5px 2px 3px; min-height: 36px; }
}
