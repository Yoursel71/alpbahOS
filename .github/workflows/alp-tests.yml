# alp prototipinin pytest paketi. Gerçek make/git kullanan testler de çalışır.
# Yalnız test: derleme/ISO çıktısı üretmez ve saklamaz.
name: alp testleri

on:
  push:
    paths: ["docs/handoffs/claude/alp-prototype/**", ".github/workflows/alp-tests.yml"]
  pull_request:
    paths: ["docs/handoffs/claude/alp-prototype/**", ".github/workflows/alp-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    name: Python ${{ matrix.python }}
    defaults:
      run:
        working-directory: docs/handoffs/claude/alp-prototype
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: docs/handoffs/claude/alp-prototype
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      # ALP-TRUST-01: the suite signs test catalogs (gpg, gpgv) and builds inside bubblewrap.
      # Ubuntu runners restrict unprivileged user namespaces; without the sysctl the
      # sandbox tests skip with a visible reason instead of running.
      - name: Signature and sandbox tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg gpgv bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: python -m pytest tests/ -q
