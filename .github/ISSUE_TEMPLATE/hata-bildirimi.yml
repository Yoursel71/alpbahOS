name: Hata bildirimi
description: alpbahOS'ta bir şey çalışmıyor ya da yanlış çalışıyor
labels: ["hata"]
body:
  - type: textarea
    id: ne-oldu
    attributes:
      label: Ne oldu?
      description: Ne yapmaya çalıştın, ne bekliyordun, ne oldu? Ekran görüntüsü ekleyebilirsin.
    validations:
      required: true
  - type: textarea
    id: adimlar
    attributes:
      label: Nasıl tekrarlanır?
      placeholder: "1. ...\n2. ...\n3. ..."
  - type: input
    id: surum
    attributes:
      label: Sürüm
      description: Terminalde `alpbahos-update --check` çıktısı (örnek 2026.11.28.5) ve ISO adı (örnek R53e)
    validations:
      required: true
  - type: textarea
    id: donanim
    attributes:
      label: Bilgisayar
      description: İşlemci, ekran kartı, RAM; dizüstü mü masaüstü mü? `fastfetch` çıktısını yapıştırabilirsin.
  - type: textarea
    id: doktor
    attributes:
      label: alp doctor çıktısı
      description: Terminalde `alp doctor` yazıp çıktıyı buraya yapıştır.
      render: text
