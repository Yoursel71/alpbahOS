# alpbahOS 0.9 Beta live ISO: boot menu (BIOS and UEFI read this file from the ISO).
# build-iso.sh --debug adds the diagnostic arguments (rd.debug, journal to console) to the kernel line.
# GRUB-THEME-01 / LIVE-GRUB-THEME-01 (D159): the alpbahOS theme (build-iso.sh copies it from r4-root
# /boot/grub/themes/alpbahos). Without the fonts GRUB keeps its text menu. BIOS tries 1024x768 first: GRUB's
# "auto" gives 640x480 when the firmware has no EDID mode (QEMU, VirtualBox), and the theme does not fit 640x480.
# UEFI keeps the firmware's current mode (normally the screen's native mode).
set default=0
set timeout=5
set timeout_style=menu
set gfxpayload=keep
set locale_dir=$prefix/locale
set lang=tr_TR
insmod gettext
set T=/boot/grub/themes/alpbahos
if loadfont $T/jbm-16.pf2 ; then
    if [ "$grub_platform" = pc ]; then set gfxmode=1024x768,auto; else set gfxmode=auto; fi
    insmod all_video
    insmod gfxterm
    insmod gfxmenu
    insmod png
    loadfont $T/inter-15.pf2
    loadfont $T/inter-20.pf2
    loadfont $T/inter-bold-52.pf2
    loadfont $T/inter-sb-20.pf2
    loadfont $T/jbm-14.pf2
    loadfont $T/jbm-15.pf2
    terminal_output gfxterm
    set theme=$T/theme.txt
    export theme
fi

# NOUVEAU-HANG-01: nouveau hangs at "loading" on the user's RTX 5060 (real PC, r45 USB); the live entries skip it
# (the firmware framebuffer / simpledrm keeps the screen). The second entry also adds nomodeset.
menuentry "alpbahOS 0.9 Beta (canlı)" --class alpbahos {
    linux /boot/vmlinuz root=live:CDLABEL=ALPBAHOS_BETA rd.live.image rd.live.dir=LiveOS rd.live.squashimg=squashfs.img rd.live.overlay.overlayfs=1 console=tty0 console=ttyS0,115200 modprobe.blacklist=nouveau
    initrd /boot/initramfs-live.img
}

menuentry "alpbahOS 0.9 Beta (canlı, güvenli grafik)" --class alpbahos {
    linux /boot/vmlinuz root=live:CDLABEL=ALPBAHOS_BETA rd.live.image rd.live.dir=LiveOS rd.live.squashimg=squashfs.img rd.live.overlay.overlayfs=1 console=tty0 console=ttyS0,115200 modprobe.blacklist=nouveau nomodeset
    initrd /boot/initramfs-live.img
}

menuentry "alpbahOS 0.9 Beta (canlı, nouveau açık: eski NVIDIA kartlar)" --class alpbahos {
    linux /boot/vmlinuz root=live:CDLABEL=ALPBAHOS_BETA rd.live.image rd.live.dir=LiveOS rd.live.squashimg=squashfs.img rd.live.overlay.overlayfs=1 console=tty0 console=ttyS0,115200
    initrd /boot/initramfs-live.img
}
