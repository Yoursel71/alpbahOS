# AlpbahOS BETA live ISO: boot menu (BIOS and UEFI read this file from the ISO).
set default=0
set timeout=5
set gfxpayload=keep

menuentry "AlpbahOS 13.1 BETA (live)" {
    linux /boot/vmlinuz root=live:CDLABEL=ALPBAHOS_BETA rd.live.image rd.live.dir=LiveOS rd.live.squashimg=squashfs.img rd.live.overlay.overlayfs=1 rd.debug systemd.journald.forward_to_console=1 console=ttyS0,115200 console=tty0
    initrd /boot/initramfs-live.img
}
