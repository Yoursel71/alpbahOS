# AlpbahOS BETA installer (Calamares 3.3.14). Installed to /etc/calamares/settings.conf of the live image only.
# Sequence: pages, then the exec phase (jobs), then the finished page.
---
modules-search: [ local ]

branding: alpbahos

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@live-cleanup
  - grubcfg
  - bootloader
  - umount
- show:
  - finished
