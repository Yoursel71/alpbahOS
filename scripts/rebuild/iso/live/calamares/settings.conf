# AlpbahOS BETA installer (Calamares 3.3.14). Installed to /etc/calamares/settings.conf of the live image only.
# Sequence: pages, then the exec phase (jobs), then the finished page.
---
modules-search: [ local ]

branding: alpbahos

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false

# Custom instances: an instance key with "@" must be declared here, or its script is not loaded (found 2026-11-08).
instances:
- id: initramfs
  module: shellprocess
  config: shellprocess_initramfs.conf
- id: live-cleanup
  module: shellprocess
  config: shellprocess_live-cleanup.conf
- id: live-keyboard
  module: shellprocess
  config: shellprocess_live-keyboard.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - shellprocess@live-keyboard
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@initramfs
  - shellprocess@live-cleanup
  - grubcfg
  - bootloader
  - umount
- show:
  - finished
