# AlpbahOS BETA: kernel file systems and runtime mounts for the target (chroot) during the exec phase.
# Without /dev, grub-install cannot find the device of /boot/efi ("is /dev mounted?"); without efivarfs, efibootmgr
# cannot register the boot entry ("EFI variables are not supported"). Found 2026-11-08 (bootloader job).
# Calamares 3.3: an entry with "efi: true" is mounted only for an EFI install.
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sysfs
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
