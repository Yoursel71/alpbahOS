# alpbahOS installer (D166): writes the driver choice of the "Sürücüler" page into the new system (in its chroot)
# and enables the first-boot service; installs nothing during the install.
---
dontChroot: false
packagechooser_drivers:
    nvidia: "/usr/libexec/alpbahos/drivers-mark nvidia"
    "*": "/bin/true"
