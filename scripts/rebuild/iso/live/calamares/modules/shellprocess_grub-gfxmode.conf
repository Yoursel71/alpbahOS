# GRUB-GFXMODE-01 (D158): writes the live display's preferred mode into the target's GRUB_GFXMODE ("<WxH>,auto"),
# after grubcfg wrote /etc/default/grub and before bootloader runs grub-mkconfig. Runs in the live system.
---
dontChroot: true
timeout: 30
script:
    - "/bin/sh /usr/lib/alpbahos/target-grub-gfxmode.sh @@ROOT@@"
