# alpbahOS installer (D166): the "Sürücüler" page. The choice is GlobalStorage packagechooser_drivers ("" or
# "nvidia"); contextualprocess_drivers-mark.conf writes it into the new system, where a first-boot service installs it.
---
mode: optional
method: legacy
labels:
    step: "Sürücüler"
items:
    - id: ""
      name: "Ek sürücü yok"
      description: "AMD ve Intel ekran kartı, ses, dokunmatik ekran ve kalem, Wi-Fi, Bluetooth, kamera ve yazıcı sürücüleri alpbahOS'ta zaten var ve kendiliğinden çalışır; seçmen gerekmez. Burada yalnızca internetten indirilen kapalı kaynak sürücüler var. NVIDIA kartın yoksa ya da açık kaynak sürücüyle (nouveau) devam etmek istiyorsan bunu seç; NVIDIA sürücüsünü sonra da kurabilirsin: sudo alp install nvidia"
      screenshot: ":/images/no-selection.png"
    - id: nvidia
      name: "NVIDIA sürücüsü"
      description: "RTX 20 serisi ve sonrası için NVIDIA'nın sürücüsü (açık çekirdek modülleriyle; 3D, Vulkan, CUDA ve video hızlandırma). Kurulum bittikten sonra ilk açılışta, internet varsa NVIDIA'nın sitesinden indirilir ve bilgisayarında derlenir (birkaç dakika); bitince yeniden başlatman istenir. Bilgisayarda NVIDIA kartı yoksa hiçbir şey kurulmaz."
      screenshot: ":/images/no-selection.png"
