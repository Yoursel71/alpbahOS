    - id: ""
      name: "Ek sürücü yok (önerilen)"
      description: "Ekran kartı (AMD, Intel, NVIDIA için açık kaynak nouveau), ses, Wi-Fi, Bluetooth, dokunmatik ekran, kamera ve yazıcı sürücüleri alpbahOS'ta zaten var ve kendiliğinden çalışır. NVIDIA kartın yoksa bunu seç."
      screenshot: "/usr/share/calamares/branding/alpbahos/surucu-acik.png"
    - id: nvidia
      name: "NVIDIA sürücüsü"
      description: "RTX 20 serisi ve sonrası için NVIDIA'nın kendi sürücüsü. Kurulumdan sonraki ilk açılışta, internet varsa NVIDIA'nın sitesinden indirilir ve bilgisayarında derlenir (birkaç dakika); bitince yeniden başlatman istenir. NVIDIA kartı yoksa hiçbir şey kurulmaz."
      screenshot: "/usr/share/calamares/branding/alpbahos/surucu-nvidia.png"
