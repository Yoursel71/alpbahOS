# AlpbahOS BETA: the installation source is the live squashfs. dracut's dmsquash-live mounts the ISO at
# /run/initramfs/live, so the image is LiveOS/squashfs.img on it (the ISO is read-only; the target is the disk).
unpack:
    - source: "/run/initramfs/live/LiveOS/squashfs.img"
      sourcefs: "squashfs"
      destination: ""
