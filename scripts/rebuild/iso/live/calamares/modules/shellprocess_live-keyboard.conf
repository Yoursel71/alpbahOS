# alpbahOS BETA: copies the keyboard layout chosen in the live session into the target (before the keyboard step).
# Runs in the live system (dontChroot); @@ROOT@@ is the target root. See live-layout-copy.sh.
dontChroot: true
timeout: 60
script:
    - "/bin/sh /usr/lib/alpbahos/live-layout-copy.sh @@ROOT@@"
