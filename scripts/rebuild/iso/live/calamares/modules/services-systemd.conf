# alpbahOS: systemd units in the installed system (the display manager is set by displaymanager).
# Calamares 3.3 reads only the "units" list; the older "services"/"targets" keys used here before 2026-11-10 were
# ignored, so this step did nothing (found in the NET-FW-01 review).
# NET-FW-01 (D147): NetworkManager manages the links; systemd-networkd and every networkd socket are disabled, so
# networkd is not started by socket activation either. r4-root ships the same state; this repeats it on the target.
---
units:
    - name: "NetworkManager.service"
      action: "enable"
      mandatory: true
    - name: "systemd-networkd.service"
      action: "disable"
      mandatory: true
    - name: "systemd-networkd.socket"
      action: "disable"
      mandatory: true
    - name: "systemd-networkd-varlink.socket"
      action: "disable"
      mandatory: true
    - name: "systemd-networkd-varlink-metrics.socket"
      action: "disable"
      mandatory: true
    - name: "systemd-networkd-resolve-hook.socket"
      action: "disable"
      mandatory: true
    - name: "systemd-network-generator.service"
      action: "disable"
      mandatory: true
    - name: "systemd-resolved.service"
      action: "enable"
      mandatory: true
    - name: "systemd-timesyncd.service"
      action: "enable"
      mandatory: false
    - name: "graphical.target"
      action: "set-default"
      mandatory: false
