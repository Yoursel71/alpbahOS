# AlpbahOS BETA: systemd units enabled in the installed system (the display manager is set by displaymanager).
---
services:
    - name: "systemd-networkd"
      mandatory: true
    - name: "systemd-resolved"
      mandatory: false
    - name: "systemd-timesyncd"
      mandatory: false

targets:
    - name: "graphical"
      enable: true
