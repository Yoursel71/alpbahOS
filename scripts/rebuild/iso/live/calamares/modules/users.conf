# AlpbahOS BETA: user accounts. The live user is removed from the installed system by target-cleanup.sh.
---
defaultGroups:
    - users
    - wheel
    - audio
    - video
    - input

autologinGroup: ""
doAutologin: false
# Empty: R4 has no sudo, so /etc/sudoers.d does not exist and the users job failed writing it (found 2026-11-08).
sudoersGroup: ""
setRootPassword: false
availableShells: "/bin/bash"
userShell: "/bin/bash"
passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
    libpwquality: []
