# alpbahOS BETA: user accounts. The live user is removed from the installed system by target-cleanup.sh.
---
defaultGroups:
    - users
    - wheel
    - audio
    - video
    - input
    # PRINT-01 (round 44): CUPS' SystemGroup is lpadmin; the first user (an administrator, wheel) can add printers in
    # the KDE printer settings without a separate login
    - lpadmin

autologinGroup: ""
doAutologin: false
# SUDO-01 (D151): sudo is in the image (r21); Calamares writes /etc/sudoers.d/10-installer for wheel, the same rule
# as the image's 10-alpbahos-wheel. (Until r20 this was empty: without sudo, /etc/sudoers.d did not exist.)
sudoersGroup: wheel
setRootPassword: false
availableShells: "/bin/bash"
userShell: "/bin/zsh"   # SHELL-R4-01 (D119)
# INSTALL-CLEANUP-01 (D149): "live" is the live session's account; the installer refuses it as a login name, so the
# live-user checks never collide with the user's own account. Calamares 3.3 key user.forbidden_names (the module
# binary has it); the shell stays /bin/bash.
user:
    shell: "/bin/bash"
    forbidden_names: [ live ]
passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
    libpwquality: []
