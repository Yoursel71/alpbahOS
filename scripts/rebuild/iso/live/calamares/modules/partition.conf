# alpbahOS BETA: partitioning. Erase-disk install by default; no swap partition; ext4 root.
---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: "EFI"

defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4" ]

initialPartitioningChoice: "erase"
initialSwapChoice: "none"
userSwapChoices: [ none ]
neverCreateSwap: true
ensureSuspendToDisk: false

# INSTALL-LUKS-01 (D139, round 50): "Encrypt system" checkbox on the erase/replace pages. LUKS1, because GRUB 2.12 (cryptodisk, /boot
# inside the encrypted root) cannot read LUKS2's argon2id key derivation. The boot key file (luksbootkeyfile) makes the
# passphrase a one-time question at GRUB; the initramfs unlocks root with the key file.
enableLuksAutomatic: true
luksGeneration: luks1

allowManualPartitioning: true
drawNestedPartitions: false
alwaysShowPartitionLabels: true
showNotEnoughDiskSpaceWarning: true
