# alpbahOS BETA: display manager for the installed system is sddm (Plasma Wayland session).
---
displaymanagers:
    - sddm

basicSetup: false
sysconfigSetup: false

defaultDesktopEnvironment:
    executable: "/usr/libexec/plasma-dbus-run-session-if-needed /usr/bin/startplasma-wayland"
    desktopFile: "plasma"
