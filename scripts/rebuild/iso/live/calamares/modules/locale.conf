# alpbahOS installer (LOCALE-DEFAULT-01, D120): default time zone Europe/Istanbul, so the regional formats default to
# Turkish (tr_TR) as well. Without this file Calamares used America/New_York and en_US formats (seen on r20 installs).
# The user can still pick another zone on the locale page.
---
region: "Europe"
zone: "Istanbul"
useSystemTimezone: false
# KUTU-LOCALE-01 (round 42): canonical names (tr_TR.UTF-8), so the installed /etc/locale.conf matches what Debian
# and distrobox-init expect; without it Calamares falls back to `locale -a` (tr_TR.utf8).
localeGenPath: "/usr/share/alpbahos/calamares/locale.gen"
