# alpbahOS installer (INSTALL-UID-01, D148): runs inside the installed system (chroot of the target) after the files
# are copied and before the users step. Removes the live user so the first installed user gets UID 1000; exits 1 (and
# so fails the install) when a post-check fails. See target-live-user.sh.
---
dontChroot: false
timeout: 300
script:
    - "/bin/sh /usr/lib/alpbahos/target-live-user.sh"
