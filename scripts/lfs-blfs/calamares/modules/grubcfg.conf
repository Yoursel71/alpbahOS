#
# alpbahOS grubcfg module (Calamares 3.3.14, upstream key names).
# Writes /etc/default/grub in the target system. Decision D144: the installed
# system has no initramfs, so the kernel root must be PARTUUID=, not UUID=.
# The runner also appends GRUB_DEVICE='PARTUUID=...' (scripts/lfs-blfs/calamares/runner/m11-run.sh).
---
# true: always write /etc/default/grub from scratch with the values below.
# The target has no /etc/default/grub in the rootfs (checked 2026-11-06), so a
# fresh write is deterministic and the defaults below are always applied.
overwrite: true

# false: write the single file /etc/default/grub, not /etc/default/grub.d/00Calamares.
prefer_grub_d: false

# false: GRUB_DISTRIBUTOR is taken from branding bootloaderEntryName ("alpbahOS").
keep_distributor: false

# Kernel parameters written to GRUB_CMDLINE_LINUX_DEFAULT.
# PLYMOUTH-01 (D160): "splash" shows the alpbahOS boot splash (Plymouth is in the installed initramfs).
# build-iso.sh DEBUG=1 removes both words for the diagnostic ISO.
kernel_params: [ "quiet", "splash" ]

# Defaults written to /etc/default/grub (applied because overwrite is true).
defaults:
    GRUB_DISTRIBUTOR: "alpbahOS"
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    # GRUB-THEME-01 (D156): graphical menu with the alpbahOS theme. GRUB on this base has no unicode.pf2, so
    # GRUB_FONT points at the theme's JetBrains Mono font (grub-mkconfig falls back to a missing "unicode"
    # otherwise). gfxmode auto: the display's preferred mode (EDID), 640x480 when the firmware gives none.
    # GRUB is not on the serial console (it was not before either); the kernel line is unchanged.
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_GFXMODE: "auto"
    GRUB_FONT: "/boot/grub/themes/alpbahos/jbm-16.pf2"
    GRUB_THEME: "/boot/grub/themes/alpbahos/theme.txt"
    GRUB_DISABLE_RECOVERY: true
    GRUB_DISABLE_LINUX_UUID: true
    GRUB_DISABLE_LINUX_PARTUUID: false

# Not needed while overwrite is true; kept false (upstream default).
always_use_defaults: false
