modules-search: [ local, /usr/lib/calamares/modules ]
branding: default
prompt-install: false
dont-chroot: false
sequence:
- show:
  - partition
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  - networkcfg
  - hwclock
  - grubcfg
  - bootloader
  - umount
- show:
  - finished
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
